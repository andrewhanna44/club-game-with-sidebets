<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<title>Club Game</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Club Game">
<meta name="theme-color" content="#12283f">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="manifest" href="site.webmanifest">
<style>
:root{
  --brand:#12283f; --brand2:#1d4470; --brand3:#2d6098;
  --bg:#eef1f6; --card:#ffffff; --ink:#131c26; --mute:#66727f;
  --line:#dde3ec; --red:#b3261e; --gold:#b8892b; --blue:#2a5d9e;
  --pos:#1a7f3c; --neg:#b3261e;
  --pad:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
html,body{margin:0;padding:0}
/* Turf: subtle mown-fairway texture, navy-tinted so it sits under the
   brand rather than fighting it. Cards stay solid white on top — the
   texture never goes anywhere a number has to stay readable. */
body{
  font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  color:var(--ink);
  background-color:var(--bg);
  background-image:
    radial-gradient(circle at 18% 12%, rgba(24,58,96,.075) 0 38%, transparent 39%),
    radial-gradient(circle at 82% 26%, rgba(24,58,96,.055) 0 32%, transparent 33%),
    radial-gradient(circle at 46% 78%, rgba(24,58,96,.065) 0 42%, transparent 43%),
    repeating-linear-gradient(115deg, rgba(24,58,96,.038) 0 22px, transparent 22px 46px);
  background-attachment:fixed;
  padding-bottom:calc(64px + var(--pad));
  -webkit-text-size-adjust:100%;
}
h1,h2,h3{margin:0;font-weight:650;letter-spacing:-.01em}
button{font:inherit;color:inherit;cursor:pointer}
input,select{font:inherit;color:inherit}

/* ---------- chrome ---------- */
header{
  position:sticky;top:0;z-index:40;background:var(--brand);color:#fff;
  padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 12px;
  display:flex;align-items:center;gap:10px;
}
header .ttl{font-size:17px;font-weight:650;line-height:1.2}
header .sub{font-size:12px;opacity:.72;line-height:1.2;margin-top:2px}
header .spacer{flex:1}
.hbtn{background:rgba(255,255,255,.14);border:0;color:#fff;border-radius:9px;padding:7px 11px;font-size:13px;font-weight:600}
.hbtn:active{background:rgba(255,255,255,.28)}
.syncpill{display:flex;align-items:center;gap:5px;font-size:10.5px;color:rgba(255,255,255,.65);margin-top:3px}
.syncpill .led{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.35);flex:none}
.syncpill.on .led{background:#5fd685}
.syncpill.err{color:#ffd7d0}
.syncpill.err .led{background:#ff8a75}

/* :empty — on the login screen the nav has no buttons, and an empty fixed bar
   with a border reads as a stray strip floating at the bottom of the page. */
nav{
  position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;
  background:#fff;border-top:1px solid var(--line);
  padding-bottom:var(--pad);
}
nav:empty{display:none}
body.noNav{padding-bottom:24px}
nav button{
  flex:1;border:0;background:none;padding:9px 2px 8px;
  display:flex;flex-direction:column;align-items:center;gap:3px;
  font-size:10.5px;font-weight:600;color:var(--mute);letter-spacing:.01em;
}
nav button svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--brand2)}

main{padding:14px 12px 22px;max-width:760px;margin:0 auto}

/* ---------- primitives ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:13px;margin-bottom:11px;overflow:hidden}
.card>.hd{padding:11px 13px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:9px}
.card>.hd h3{font-size:14px}
.card>.bd{padding:13px}
.card>.bd.flush{padding:0}
.muted{color:var(--mute)}
.tiny{font-size:12px}
.mono{font-variant-numeric:tabular-nums}
.row{display:flex;align-items:center;gap:9px}
.row.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.right{margin-left:auto}
.trunc{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.btn{background:var(--brand2);color:#fff;border:0;border-radius:10px;padding:10px 15px;font-weight:600;font-size:14px}
.btn:active{background:var(--brand)}
.btn.ghost{background:#fff;color:var(--brand2);border:1px solid var(--line)}
.btn.ghost:active{background:#e9eff7}
.btn.sm{padding:7px 11px;font-size:13px;border-radius:9px}
.btn.danger{background:var(--red)}
.btn:disabled{opacity:.4}
.btn.block{width:100%;display:block}

label.f{display:block;margin-bottom:11px}
label.f>span{display:block;font-size:11.5px;font-weight:650;text-transform:uppercase;letter-spacing:.05em;color:var(--mute);margin-bottom:4px}
input[type=text],input[type=number],input[type=time],input[type=date],input[type=email],select,textarea{
  width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:9px;background:#fff
}
input:focus,select:focus,textarea:focus{outline:2px solid var(--brand3);outline-offset:-1px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 10px}

.pill{display:inline-block;padding:2px 7px;border-radius:99px;font-size:11px;font-weight:650;background:#e9eff7;color:var(--brand2)}
.pill.warn{background:#fdf1dc;color:#8a5d09}
.pill.grey{background:#eee;color:var(--mute)}
.pill.red{background:#fbe9e7;color:var(--red)}
.pos{color:var(--pos);font-weight:650}
.neg{color:var(--neg);font-weight:650}
.zero{color:var(--mute)}

.empty{text-align:center;padding:28px 16px;color:var(--mute);font-size:13.5px}
.banner{background:#fdf1dc;border:1px solid #edd9ab;color:#7a5406;border-radius:11px;padding:10px 12px;font-size:12.5px;margin-bottom:11px}
.banner b{color:#5c3f04}

table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);font-size:13.5px}
th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--mute);font-weight:650}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}

.lrow{display:flex;align-items:center;gap:11px;padding:11px 13px;border-bottom:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left}
.lrow:last-child{border-bottom:0}
.lrow:active{background:#f1f4f9}
.rank{width:24px;text-align:center;font-weight:700;color:var(--mute);font-size:13px;flex:none}
.chev{width:8px;height:8px;border-right:2px solid #c3ccc5;border-bottom:2px solid #c3ccc5;transform:rotate(-45deg);flex:none;margin-right:2px}
.score{font-size:19px;font-weight:700;font-variant-numeric:tabular-nums;flex:none}

/* ---------- scorecard entry ---------- */
.holebar{display:flex;align-items:center;gap:10px;background:var(--brand);color:#fff;border-radius:12px;padding:11px 13px;margin-bottom:11px}
.holebar .h{font-size:24px;font-weight:750;line-height:1}
.holebar .meta{font-size:11.5px;opacity:.78;line-height:1.35}
.holebar button{background:rgba(255,255,255,.16);border:0;color:#fff;width:38px;height:38px;border-radius:10px;font-size:19px;line-height:1;flex:none}
.holebar button:disabled{opacity:.28}

.prow{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line)}
.prow:last-child{border-bottom:0}
.prow .nm{font-weight:600;font-size:14px}
.prow .hc{font-size:11.5px;color:var(--mute)}
.teetag{font-weight:500;font-size:12px;color:var(--mute)}
.scorebox{
  width:62px;height:48px;flex:none;padding:0;text-align:center;
  font-size:21px;font-weight:700;font-variant-numeric:tabular-nums;
  border:1.5px solid var(--line);border-radius:11px;background:#fff;
  -moz-appearance:textfield
}
.scorebox::-webkit-outer-spin-button,.scorebox::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.scorebox:focus{border-color:var(--brand3);outline:2px solid rgba(45,96,152,.25);outline-offset:0}
.scorebox:disabled{background:#f4f6f9;color:var(--mute)}
.scorebox::placeholder{color:#c2cad6;font-weight:500}
.dot{position:relative}
.dot::after{content:"";position:absolute;top:4px;right:4px;width:5px;height:5px;border-radius:50%;background:var(--red)}
.dot.d2::after{box-shadow:-7px 0 0 var(--red)}

.cardtbl td,.cardtbl th{padding:6px 5px;font-size:12px;text-align:center}
.cardtbl th:first-child,.cardtbl td:first-child{text-align:left;position:sticky;left:0;background:#fff;z-index:1;min-width:96px;padding-left:11px}
.cardtbl thead th{background:#f1f4f9}
.cardtbl .par td{background:#f6f8fb;color:var(--mute);font-size:11px}
.cardtbl .tot{font-weight:700;background:#f1f4f9}
.u{color:var(--red);font-weight:700}
.o{color:var(--mute)}

/* swipe-to-reject: the red action sits underneath, the content slides over it */
.betwrap{position:relative;overflow:hidden;border-bottom:1px solid var(--line)}
.betwrap:last-child{border-bottom:0}
.betact{
  position:absolute;top:0;right:0;bottom:0;width:118px;
  display:flex;align-items:center;justify-content:center;
  background:var(--red);color:#fff;font-size:13px;font-weight:700;text-align:center;line-height:1.2
}
.betact.restore{background:var(--brand2)}
.betrow{padding:11px 13px;background:var(--card);position:relative;touch-action:pan-y}
.betrow.void{opacity:.45}
.betrow.sliding{transition:none}
.betrow.snap{transition:transform .18s ease}
.betside{display:flex;align-items:center;gap:8px;padding:3px 0}
.betside .who{flex:1;font-size:13.5px;min-width:0}
.betside .sc{font-variant-numeric:tabular-nums;font-weight:700;font-size:15px;width:32px;text-align:right}
.betside .amt{font-variant-numeric:tabular-nums;font-weight:650;font-size:13.5px;width:52px;text-align:right}
.vs{font-size:10px;font-weight:700;color:var(--mute);letter-spacing:.08em;padding:1px 0}

.sheet{position:fixed;inset:0;z-index:100;background:rgba(10,20,14,.42);display:flex;align-items:flex-end;justify-content:center}
.sheet .inner{background:var(--bg);width:100%;max-width:560px;max-height:92vh;display:flex;flex-direction:column;border-radius:16px 16px 0 0;overflow:hidden}
.sheethd{display:flex;align-items:center;gap:10px;padding:14px 14px 10px;border-bottom:1px solid var(--line);background:var(--bg);flex:none}
.sheethd h2{font-size:17px;flex:1;margin:0}
.sheetx{
  flex:none;width:34px;height:34px;border:0;border-radius:50%;
  background:#e2e7ef;color:var(--ink);font-size:22px;line-height:1;
  display:flex;align-items:center;justify-content:center;font-weight:500
}
.sheetx:active{background:#d2d9e4}
.sheetbody{overflow-y:auto;padding:14px 14px calc(20px + var(--pad));-webkit-overflow-scrolling:touch}
.sheet h2{font-size:17px}
.sidecard{background:#fff;border:1px solid var(--line);border-radius:12px;padding:11px 12px;margin-bottom:11px}
.sidettl{font-size:13px;font-weight:700;color:var(--brand)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 0}
.chips:empty{display:none}
.chip{
  display:inline-flex;align-items:center;gap:7px;
  background:#eaf1fa;color:var(--brand);border:1px solid #cddcee;
  border-radius:99px;padding:6px 10px 6px 12px;font-size:13.5px;font-weight:600
}
.chip b{font-weight:600;font-size:16px;color:var(--mute);line-height:1}
.chip:active{background:#dbe7f5}
.addsel{margin-top:9px;background:#fff;color:var(--brand2);font-weight:600}
.pickgrid{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.pick{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 10px;text-align:left;font-size:13.5px;font-weight:600}
.pick.on{border-color:var(--brand3);background:#eaf1fa;color:var(--brand)}
.pick .s{display:block;font-size:11px;font-weight:500;color:var(--mute);margin-top:1px}
.pick.on .s{color:var(--brand3)}

.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}
.seg button{flex:1;border:0;background:none;padding:8px 4px;font-size:12.5px;font-weight:600;color:var(--mute)}
.seg button.on{background:var(--brand2);color:#fff}
.setuplink{display:flex;align-items:center;gap:10px;padding:13px;border-bottom:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left;font-size:14px;font-weight:600}
.setuplink:last-child{border-bottom:0}
.setuplink:active{background:#f1f4f9}
/* display:block — without it the description runs straight into the title
   ("Game codesStarted 8/5"), because flex collapses the gap between them. */
.setuplink .d{display:block;font-size:12px;font-weight:400;color:var(--mute);margin-top:2px;line-height:1.35}
.setuphd{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--mute);margin:16px 4px 7px}
.setuphd:first-child{margin-top:2px}
</style>
</head>
<body>
<header>
  <div class="grow">
    <div class="ttl" id="h-ttl">Club Game</div>
    <div class="sub" id="h-sub"></div>
  </div>
  <button class="hbtn" id="h-me">Me</button>
</header>
<main id="main"></main>
<nav id="nav"></nav>

const money = n => (n<0?"-":"") + "$" + Math.abs(Math.round(n));

/* ------------------------------------------------------------

      if(raw){ this.s = JSON.parse(raw); this.migrate(); return; }
    }catch(e){ console.warn("load failed, reseeding", e); }
    this.freshlySeeded = true;   // this device made this up locally — don't trust it over real shared data

    const s = this.s;

    // keep the built-in course definition authoritative unless the user edited it
    if(!s.courses || !s.courses.length) s.courses = [CROASDAILE];
    s.players.forEach(p=>{ if(p.sex==null) p.sex="M"; });
    s.players.forEach(p=>{ if(!s.scores[p.id]) s.scores[p.id] = new Array(H).fill(null); });
    if(!s.bets) s.bets = [];
    if(s.game.draw===undefined) s.game.draw = null;
    if(s.game.startedAt===undefined) s.game.startedAt = null;
    if(!s.meta) s.meta = { scores:{}, players:{}, groups:{}, bets:{}, entrants:{}, draw:0, settings:0, admin:0 };

/* ------------------------------------------------------------
   LOOKUPS
   ------------------------------------------------------------ */
const G      = ()=> Store.s.game;
const course = ()=> Store.s.courses.find(c=>c.id===G().courseId) || Store.s.courses[0];
const par    = h => course().par[h];
const parTot = ()=> sum(course().par);
const player = id => Store.s.players.find(p=>p.id===id);
const pname  = id => { const p=player(id); return p? p.name : "—"; };
const teeOf  = id => { const e=G().entrants[id]; return e? course().tees.find(t=>t.id===e.teeId) : null; };
const inGame = ()=> Object.keys(G().entrants).filter(id=>player(id));
const groupOf= pid => G().groups.find(g=>g.pids.includes(pid));
const gross  = (pid,h)=>{ const a=Store.s.scores[pid]; return a? a[h] : null; };

/* ------------------------------------------------------------
   HANDICAP ENGINE
   Course Handicap = Index x (Slope/113) + (Rating - Par)
   ------------------------------------------------------------ */
function courseHcp(pid){
  const p = player(pid), t = teeOf(pid);
  if(!p || !t || p.index==null) return null;
  const women = p.sex === "F";
  const rating = women && t.ratingW!=null ? t.ratingW : t.rating;
  const slope  = women && t.slopeW !=null ? t.slopeW  : t.slope;
  if(rating==null || slope==null) return null;
  return Math.round(p.index * (slope/113) + (rating - parTot()));
}

/** Playing handicap after the game's allowance rule. null = no index on file. */
function playingHcp(pid){
  const ch = courseHcp(pid);
  if(ch==null) return null;
  const a = G().allowance;
  if(a.mode === "pct") return Math.round(ch * (a.pct/100));
  if(a.mode === "low"){
    const all = inGame().map(courseHcp).filter(v=>v!=null);
    if(!all.length) return ch;
    return ch - Math.min(...all);
  }
  return ch;
}

/** Stroke index for this player's tee, 1..18 per hole. */
function siFor(pid, h){
  const t = teeOf(pid), c = course();
  const p = player(pid);
  let set = t ? t.si : "menA";
  if(p && p.sex === "F") set = "ladies";
  const arr = c.siSets[set] || c.siSets.menA;
  return arr[h];
}

/** Strokes given on a hole. Negative for plus handicaps (strokes given back). */
function strokes(pid, h){
  const ph = playingHcp(pid);
  if(ph==null || ph===0) return 0;
  const si = siFor(pid,h);
  if(ph > 0){
    const base = Math.floor(ph/H), rem = ph % H;
    return base + (si <= rem ? 1 : 0);
  }
  const p = -ph, base = Math.floor(p/H), rem = p % H;
  return -(base + (si > H - rem ? 1 : 0));
}

function net(pid,h){
  const g = gross(pid,h);
  return g==null ? null : g - strokes(pid,h);
}
/** Score on a hole under the chosen basis. */
function val(pid,h,basis){ return basis==="net" ? net(pid,h) : gross(pid,h); }

function totalFor(pid, basis){
  let t=0, thru=0;
  for(let h=0;h<H;h++){ const v=val(pid,h,basis); if(v!=null){ t+=v; thru++; } }
  return { total:t, thru };
}

/* ------------------------------------------------------------
   TEAM SCORING
   Best N net balls per hole vs par; every net birdie-or-better
   also counts, even beyond N.  (Andrew: "3 birdies, all 3 count")
   ------------------------------------------------------------ */
function groupScore(g){
  const cfg = G().team;
  let total=0, thru=0;
  const perHole = [];
  for(let h=0;h<H;h++){
    const p = par(h);
    const nets = g.pids.map(pid=>{
      const v = net(pid,h);
      return v==null ? null : v;
    }).filter(v=>v!=null).sort((a,b)=>a-b);
    if(!nets.length){ perHole.push(null); continue; }
    thru++;
    const take = new Set();
    for(let i=0;i<Math.min(cfg.balls, nets.length);i++) take.add(i);
    if(cfg.allBirdies) nets.forEach((n,i)=>{ if(n < p) take.add(i); });
    let c=0; take.forEach(i=> c += nets[i]-p );
    perHole.push(c); total += c;
  }
  return { total, thru, perHole };
}

function teamStandings(){
  const rows = G().groups.map(g=>({ g, ...groupScore(g) }));
  const played = rows.filter(r=>r.thru>0);
  played.sort((a,b)=> a.total-b.total || a.g.teeTime.localeCompare(b.g.teeTime));
  played.forEach(r=>{ r.place = 1 + played.filter(o=>o.total < r.total).length; });
  rows.filter(r=>r.thru===0).forEach(r=> r.place=null );
  return { rows, played };
}

/* ------------------------------------------------------------
   TEAM BUILDER
   Five admin-selectable ways to form today's teams:
     committee — hand-picked, no algorithm (the existing manual UI)
     abcd      — split the field into 4 skill tiers, one per team
     snake     — rank and deal in a zig-zag draft
     balanced  — try many random splits, keep the tightest spread
     blind     — one straight random shuffle
   Every random method uses a seeded PRNG so a draw can be proven,
   not just claimed — the seed + method + timestamp are the receipt.
   ------------------------------------------------------------ */
const DRAW_METHODS = [
  ["committee","Committee pick","Admins hand-select every group — no algorithm runs."],
  ["abcd","A / B / C / D tiers","Split the field into four skill tiers by handicap, one player per team from each tier."],
  ["snake","Snake seeding","Rank the field by handicap and deal in a zig-zag draft, best to worst and back."],
  ["balanced","Balanced draw","Try thousands of random splits, keep the one with the smallest gap between team totals."],
  ["blind","Blind draw","One straight random shuffle. Fully random, no balancing at all."]
];

function mulberry32(seed){
  let a = seed >>> 0;
  return function(){
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a>>>15), 1 | a);
    t = (t + Math.imul(t ^ (t>>>7), 61 | t)) ^ t;
    return ((t ^ (t>>>14)) >>> 0) / 4294967296;
  };
}
function newSeed(){ return (Date.now() ^ Math.floor(Math.random()*1e9)) >>> 0; }
function shuffleSeeded(arr, rng){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){ const j = Math.floor(rng()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}

/** Balancing number for a player: course handicap if known, else the field
    average (or 18 if nobody has an index yet). `estimated` flags a guess. */
function balanceInfo(pid){
  const ch = courseHcp(pid);
  if(ch!=null) return { value: ch, estimated:false };
  const known = inGame().map(courseHcp).filter(v=>v!=null);
  return { value: known.length ? sum(known)/known.length : 18, estimated:true };
}

function evenSplit(n,k){
  const base = Math.floor(n/k), extra = n%k;
  return new Array(k).fill(base).map((s,i)=> s + (i<extra?1:0));
}
/** How many teams, and how big each is, for a field size and target team size. */
function splitSizes(total, teamSize){
  const T = Math.max(1, Math.round(total/Math.max(1,teamSize)));
  return evenSplit(total, T);
}
function sliceBySizes(arr, sizes){
  const out=[]; let i=0;
  sizes.forEach(sz=>{ out.push(arr.slice(i,i+sz)); i+=sz; });
  return out;
}

function snakeDeal(sortedIds, sizes){
  const T = sizes.length, teams = sizes.map(()=>[]), cap = sizes.slice();
  let t = 0, dir = 1;
  const bounce = ()=>{ t += dir; if(t>=T){ t=T-1; dir=-1; } else if(t<0){ t=0; dir=1; } };
  sortedIds.forEach(pid=>{
    while(teams[t].length >= cap[t]) bounce();
    teams[t].push(pid);
    bounce();
  });
  return teams;
}
function roundRobinDeal(ids, teams, cap, start){
  const T = teams.length; let t = start;
  ids.forEach(pid=>{
    while(teams[t].length >= cap[t]) t = (t+1)%T;
    teams[t].push(pid);
    t = (t+1)%T;
  });
  return t;
}
function abcdDeal(sortedIds, sizes){
  const T = sizes.length, teams = sizes.map(()=>[]), cap = sizes.slice();
  const tierSizes = evenSplit(sortedIds.length, 4);
  let idx=0, start=0;
  for(let tier=0; tier<4; tier++){
    const tierIds = sortedIds.slice(idx, idx+tierSizes[tier]); idx += tierSizes[tier];
    start = roundRobinDeal(tierIds, teams, cap, start);
  }
  return teams;
}

function draftStats(teams){
  const totals = teams.map(t=> sum(t.map(pid=>balanceInfo(pid).value)));
  const avgs = teams.map((t,i)=> t.length? totals[i]/t.length : 0);
  const spread = totals.length ? Math.max(...totals)-Math.min(...totals) : 0;
  return { totals, avgs, spread };
}

/** Generates one draw. Returns null for "committee" (no algorithm). */
function genTeams(method, teamSize, seed){
  const field = inGame().slice();
  const sizes = splitSizes(field.length, teamSize);
  const rng = mulberry32(seed);
  const byVal = (a,b)=> balanceInfo(a).value - balanceInfo(b).value;

  if(method==="blind"){
    return sliceBySizes(shuffleSeeded(field, rng), sizes);
  }
  if(method==="balanced"){
    let best=null, bestSpread=Infinity;
    for(let i=0;i<3000;i++){
      const teams = sliceBySizes(shuffleSeeded(field, rng), sizes);
      const spread = draftStats(teams).spread;
      if(spread < bestSpread){ bestSpread=spread; best=teams; }
    }
    return best;
  }
  const sorted = shuffleSeeded(field, rng).sort(byVal);   // rng breaks ties among equal handicaps
  if(method==="snake") return snakeDeal(sorted, sizes);
  if(method==="abcd")  return abcdDeal(sorted, sizes);
  return null;   // committee
}

function parseTeeTime(str){
  const m = /(\d+):(\d+)\s*([AP]M)/i.exec(str||"");
  if(!m) return null;
  let h = parseInt(m[1],10)%12; if(/pm/i.test(m[3])) h+=12;
  return h*60+parseInt(m[2],10);
}
function fmtTeeTime(mins){
  mins = ((mins%1440)+1440)%1440;
  const h = Math.floor(mins/60), mm = mins%60, ap = h>=12?"PM":"AM";
  let h12 = h%12; if(h12===0) h12=12;
  return h12+":"+String(mm).padStart(2,"0")+" "+ap;
}

/** Commits a generated draw into G().groups, reusing existing tee times
    where possible and extending in 10-minute steps for any extra slots. */
function applyDraw(teams, meta){
  const g = G();
  const existing = g.groups.slice().sort((a,b)=> (parseTeeTime(a.teeTime)??0)-(parseTeeTime(b.teeTime)??0));
  const T = teams.length, out = [];
  for(let i=0;i<T;i++){
    let teeTime, id;
    if(i < existing.length){ teeTime = existing[i].teeTime; id = existing[i].id; }
    else {
      const lastMin = existing.length ? parseTeeTime(existing[existing.length-1].teeTime) : 7*60;
      teeTime = fmtTeeTime((lastMin==null?7*60:lastMin) + 10*(i-existing.length+1));
      id = uid("g");
    }
    out.push({ id, teeTime, pids: teams[i].slice(), scorer:null });
  }
  g.groups = out;
  g.draw = Object.assign({}, meta, { manuallyAdjusted:false });
  Store.save();
}

/** Call after any hand-edit to group membership so the receipt stays honest. */
function markAdjusted(){
  const g = G();
  if(g.draw && g.draw.method!=="committee") g.draw.manuallyAdjusted = true;
}

/* ------------------------------------------------------------
   SKINS
   Lowest score on a hole across the whole field. Must be under
   par, and must be the only one at that number.
   ------------------------------------------------------------ */
function skins(){
  const basis = G().skins.basis;
  const field = inGame();
  const out = [];
  for(let h=0;h<H;h++){
    const p = par(h);
    const es = [];
    field.forEach(pid=>{ const v=val(pid,h,basis); if(v!=null) es.push({pid,v}); });
    if(!es.length) continue;
    const low = Math.min(...es.map(e=>e.v));
    if(low >= p) continue;                      // must be birdie or better
    const win = es.filter(e=>e.v===low);
    if(win.length !== 1) continue;              // must be solo
    out.push({ hole:h, pid:win[0].pid, score:low, par:p, under:p-low });
  }
  return out;
}

/* ------------------------------------------------------------
   SIDE BETS
   Each side is 1 or 2 players. A pair's score is their BETTER
   BALL. Payout = stake x stroke difference, capped both ways.
   Only holes where every player on both sides has posted count,
   so a bet reads correctly mid-round and out of order.
   ------------------------------------------------------------ */
function sideHole(ids,h,basis){
  const vs = ids.map(id=>val(id,h,basis));
  if(vs.some(v=>v==null)) return null;
  return Math.min(...vs);
}
function betResult(bet){
  const basis = G().betsCfg.basis;
  let a=0,b=0,thru=0;
  for(let h=0;h<H;h++){
    const sa = sideHole(bet.a,h,basis), sb = sideHole(bet.b,h,basis);
    if(sa==null || sb==null) continue;
    a+=sa; b+=sb; thru++;
  }
  if(bet.rejected) return { a,b,thru, amtA:0, amtB:0, capped:false, live:false };
  const raw = bet.stake * (b - a);
  const amtA = clamp(raw, -bet.cap, bet.cap);
  return { a,b,thru, amtA, amtB:-amtA, capped: Math.abs(raw) > bet.cap, live:true };
}
function betPL(pid){
  let t=0;
  Store.s.bets.forEach(bet=>{
    if(bet.rejected) return;
    const r = betResult(bet);
    if(bet.a.includes(pid)) t += r.amtA;
    else if(bet.b.includes(pid)) t += r.amtB;
  });
  return t;
}
function betCount(pid){
  return Store.s.bets.filter(b=> !b.rejected && (b.a.includes(pid)||b.b.includes(pid))).length;
}

/* ------------------------------------------------------------
   MONEY
   ------------------------------------------------------------ */
function ledger(){
  const m = G().money, field = inGame(), n = field.length;
  const teamPot  = n * m.teamShare;
  const skinsPot = n * m.skinsShare;
  const sk = skins();
  const skinValue = sk.length ? Math.floor(skinsPot / sk.length) : 0;

  const teamPay = {};
  const { played } = teamStandings();
  played.forEach(r=>{
    const rate = m.payouts[r.place-1];
    if(rate) r.g.pids.forEach(pid=> teamPay[pid] = (teamPay[pid]||0) + rate);
  });

  const skinsBy = {};
  sk.forEach(s=> skinsBy[s.pid] = (skinsBy[s.pid]||0) + skinValue);

  const rows = field.map(pid=>{
    const t = teamPay[pid]||0, s = skinsBy[pid]||0, b = betPL(pid);
    return { pid, team:t, skins:s, bets:b, entry:-m.entry, net: t+s+b-m.entry };
  });
  rows.sort((x,y)=> y.net - x.net);
  return { rows, teamPot, skinsPot, skinValue, skinCount: sk.length, sk };
}

/* ------------------------------------------------------------
   SETUP HEALTH — what still blocks correct handicapping
   ------------------------------------------------------------ */
function issues(){
  const out = [];
  const noIndex = Store.s.players.filter(p=> inGame().includes(p.id) && p.index==null);
  if(noIndex.length) out.push({
    k:"index",
    msg:`<b>${noIndex.length} of ${inGame().length} players have no handicap index.</b> Everything is being scored gross until they're entered. Add them under Setup → Players.`
  });
  const c = course();
  const badTee = c.tees.filter(t=> t.rating==null || t.slope==null);
  if(badTee.length) out.push({ k:"tee", msg:`<b>${badTee.length} tee(s) missing a rating or slope.</b> Course handicaps can't be computed for them.` });
  return out;
}

function render(){

    renderHeader(); $("#nav").innerHTML="";
    document.body.classList.add("noNav");

function viewLogin(m){
  m.innerHTML = "";
  const c = el("div","card"); c.style.marginTop="40px";

  const bd = el("div","bd");

  if(Store.isFirstEverDevice){
    bd.appendChild(el("div","banner","<b>You're the first one here.</b> Your admin code is <b>"+esc(Store.s.admin.code)+
      "</b> — write it down, it won't be shown like this again. Use it to log in and set everything up."));
  }
  const inp = el("input"); inp.type="text"; inp.placeholder="CODE"; inp.style.cssText="margin-top:9px;text-align:center;font-size:20px;letter-spacing:.15em;text-transform:uppercase;font-weight:700";

  bd.appendChild(err);
  const go = el("button","btn block","Enter"); go.style.marginTop="9px";
  const tryLogin = ()=>{
    const code = inp.value.trim().toUpperCase();
    if(!code) return;
    if(code === (Store.s.admin.code||"").toUpperCase()){
      Store.s.session = { role:"admin", groupId:null }; Store.save(); render(); return;
    }
    const g = G().groups.find(x=> x.code && x.code.toUpperCase()===code);
    if(g){ Store.s.session = { role:"group", groupId:g.id }; Store.save(); render(); return; }
    err.textContent = "Code not recognized.";
  };
  go.onclick = tryLogin;
  inp.onkeydown = e=>{ if(e.key==="Enter") tryLogin(); };
  bd.appendChild(go);
  c.appendChild(bd); m.appendChild(c);
  setTimeout(()=>inp.focus(), 50);

/* ---------------- SCORECARD ---------------- */
let holeIdx = 0;
let cardMode = "hole";   // "hole" | "full"

function viewCard(m, gid){
  const g = G().groups.find(x=>x.id===gid);
  if(!g){ sub=null; return render(); }

  const back = el("button","btn ghost sm","‹ All groups");
  back.onclick = ()=>{ sub=null; render(); };
  const bar = el("div","row"); bar.style.marginBottom="11px";
  bar.appendChild(back);
  const segw = el("div","seg"); segw.style.maxWidth="180px"; segw.classList.add("right");
  [["hole","Hole"],["full","Full card"]].forEach(([k,l])=>{
    const b=el("button",cardMode===k?"on":"",l);
    b.onclick=()=>{ cardMode=k; render(); };
    segw.appendChild(b);
  });
  bar.appendChild(segw);
  m.appendChild(bar);

  // access: admin can touch any card; a group login can only touch its own
  const isAdmin = Store.s.session.role==="admin";
  const ownGroup = Store.s.session.role==="group" && Store.s.session.groupId===g.id;
  const canTouch = isAdmin || ownGroup;

  const claim = el("div","card");
  const cb = el("div","bd");
  if(!canTouch){
    cb.innerHTML = "<div class='tiny muted'>Viewing "+esc(g.teeTime)+"'s card — read-only. Log in with their code to score for them.</div>";
  } else if(!g.scorer){
    const b = el("button","btn block","Keep score");
    b.onclick = ()=>{ g.scorer = Store.s.deviceId; Store.save(); render(); };
    cb.appendChild(b);
  } else {
    const mine = g.scorer === Store.s.deviceId;
    cb.innerHTML = "<div class='row'><span class='tiny'>"+
      (mine? "You're keeping this card" : "Another device is keeping this card")+"</span></div>";
    const b = el("button","btn ghost sm right", mine ? "Hand off" : "Take over");
    b.style.marginLeft="auto";
    b.onclick = ()=>{
      if(mine){ g.scorer=null; Store.save(); render(); return; }
      if(confirm("Take over this card?")){ g.scorer = Store.s.deviceId; Store.save(); render(); }
    };
    $(".row",cb).appendChild(b);
  }
  claim.appendChild(cb); m.appendChild(claim);

  const canEdit = canTouch && (!g.scorer || g.scorer === Store.s.deviceId);

  if(cardMode==="full"){ fullCard(m,g); }
  else { holeCard(m,g,canEdit); }

  const tot = el("div","card"); tot.id = "teamtot";
  m.appendChild(tot);
  refreshTeamTotal(g);

  if(isAdmin){
    const rst = el("button","btn ghost block","Reset this match");
    rst.style.cssText = "color:var(--red);margin-top:2px";
    rst.onclick = ()=>{
      if(!confirm("Wipe every score for the "+g.teeTime+" group? The players and bets stay.")) return;
      g.pids.forEach(pid=>{ Store.s.scores[pid] = new Array(H).fill(null); });
      g.scorer = null;
      Store.save(); render();
    };
    m.appendChild(rst);
  }
}

function holeCard(m,g,canEdit){
  const h = holeIdx, c = course();
  const bar = el("div","holebar");
  const yd = (()=>{ // show yardage from the first player's tee that has per-hole data
    for(const pid of g.pids){ const t=teeOf(pid); if(t && t.yards) return t.yards[h]+" yds ("+t.name+")"; }
    return "";
  })();
  bar.innerHTML =
    '<button id="prev">‹</button>'+
    '<div class="grow" style="text-align:center">'+
      '<div class="h">Hole '+(h+1)+'</div>'+
      '<div class="meta">Par '+par(h)+' · Stroke '+c.siSets.menA[h]+(yd?" · "+yd:"")+'</div>'+
    '</div>'+
    '<button id="next">›</button>';
  m.appendChild(bar);
  $("#prev",bar).disabled = h===0;
  $("#next",bar).disabled = h===H-1;
  $("#prev",bar).onclick = ()=>{ holeIdx--; render(); window.scrollTo(0,0); };
  $("#next",bar).onclick = ()=>{ holeIdx++; render(); window.scrollTo(0,0); };

  const card = el("div","card"); const bd = el("div","bd flush");
  const boxes = [];
  g.pids.forEach((pid, i)=>{
    const st = strokes(pid,h);
    const row = el("div","prow");
    const ph = playingHcp(pid);
    const tee = teeOf(pid);
    row.innerHTML =
      '<div class="grow">'+
        '<div class="nm">'+esc(pname(pid))+' <span class="teetag">('+esc(tee?tee.name:"no tee")+')</span></div>'+
        '<div class="hc">'+
          (ph!=null? "plays "+(ph>0?"+":"")+ph : "no index")+
          (st>0? " · "+st+" stroke"+(st>1?"s":"")+" here" : (st<0? " · gives "+(-st)+" back here" : ""))+'</div>'+
      '</div>';
    const inp = el("input","scorebox"+(st>0?" dot":"")+(st>1?" d2":""));
    inp.type="number"; inp.inputMode="numeric"; inp.pattern="[0-9]*";
    inp.min="1"; inp.max="20"; inp.placeholder="–";
    inp.value = gross(pid,h)==null ? "" : gross(pid,h);
    inp.disabled = !canEdit;
    boxes.push(inp);

    let advanceTimer = null;
    const commit = ()=>{
      const a = Store.s.scores[pid];
      const raw = inp.value.trim();
      a[h] = raw==="" ? null : clamp(parseInt(raw,10)||0, 1, 20);
      Store.save();
      refreshHoleFoot(g);
      refreshTeamTotal(g);
    };
    const advance = ()=>{
      const next = boxes[i+1];
      if(next && !next.disabled){ next.focus(); next.select(); }
      else inp.blur();
    };
    inp.oninput = ()=>{
      if(inp.value.length > 2) inp.value = inp.value.slice(0,2);
      commit();
      clearTimeout(advanceTimer);
      const v = inp.value;
      // Two digits is unambiguous — move on. A lone "1" might still become
      // 10/11/12, so give it a beat before jumping to the next player.
      if(v.length >= 2) advance();
      else if(v.length === 1) advanceTimer = setTimeout(advance, v === "1" ? 900 : 450);
    };
    inp.onkeydown = e=>{ if(e.key === "Enter"){ clearTimeout(advanceTimer); commit(); advance(); } };
    inp.onblur = ()=>{ clearTimeout(advanceTimer); commit(); };
    inp.onfocus = ()=> inp.select();

    row.appendChild(inp);
    bd.appendChild(row);
  });
  card.appendChild(bd); m.appendChild(card);

  const foot = el("div","card"); foot.id="holefoot";
  m.appendChild(foot); refreshHoleFoot(g);

  if(canEdit){
    const go = el("button","btn block", h < H-1 ? "Save scores & go to hole "+(h+2) : "Save scores & finish");
    go.style.marginTop="2px";
    go.onclick = ()=>{
      boxes.forEach(b=> b.blur());
      Store.save();
      if(h < H-1){ holeIdx++; render(); window.scrollTo(0,0); }
      else { cardMode = "full"; render(); window.scrollTo(0,0); }
    };
    m.appendChild(go);
  }
}

function refreshHoleFoot(g){
  const f = document.getElementById("holefoot"); if(!f) return;
  const h = holeIdx, p = par(h);
  const nets = g.pids.map(pid=>net(pid,h)).filter(v=>v!=null).sort((a,b)=>a-b);
  const gs = groupScore(g);
  const hole = gs.perHole[h];
  const posted = g.pids.filter(pid=>gross(pid,h)!=null).length;
  f.innerHTML = "<div class='bd'><div class='row'><span class='tiny muted'>This hole</span>"+
    "<span class='right mono' style='font-weight:700'>"+(hole==null?"–":signed(hole))+"</span></div>"+
    (nets.length
      ? "<div class='tiny muted' style='margin-top:4px'>Net balls: "+nets.join(", ")+" · par "+p+
        (posted < g.pids.length ? " · "+posted+" of "+g.pids.length+" in" : "")+"</div>"
      : "")+
    "</div>";
}

function fullCard(m,g){
  const c = course();
  const wrap = el("div","card"); const bd = el("div","bd flush tw");
  const t = el("table","cardtbl");
  let head = "<thead><tr><th>Hole</th>";
  for(let h=0;h<9;h++) head += "<th>"+(h+1)+"</th>";
  head += "<th>Out</th>";
  for(let h=9;h<18;h++) head += "<th>"+(h+1)+"</th>";
  head += "<th>In</th><th>Tot</th></tr></thead>";
  t.innerHTML = head;
  const tb = el("tbody");

  let pr = "<tr class='par'><td>Par</td>";
  for(let h=0;h<9;h++) pr += "<td>"+c.par[h]+"</td>";
  pr += "<td>"+sum(c.par.slice(0,9))+"</td>";
  for(let h=9;h<18;h++) pr += "<td>"+c.par[h]+"</td>";
  pr += "<td>"+sum(c.par.slice(9))+"</td><td>"+parTot()+"</td></tr>";
  // Men's stroke index, straight off the card — which hole gets a stroke first.
  pr += "<tr class='par'><td>Hcp</td>";
  for(let h=0;h<9;h++) pr += "<td>"+c.siSets.menA[h]+"</td>";
  pr += "<td></td>";
  for(let h=9;h<18;h++) pr += "<td>"+c.siSets.menA[h]+"</td>";
  pr += "<td></td><td></td></tr>";
  tb.innerHTML = pr;

  g.pids.forEach(pid=>{
    const tee = teeOf(pid);
    let r = "<tr><td>"+esc(pname(pid))+
      " <span class='teetag'>("+esc(tee?tee.name:"—")+")</span></td>";
    const cell = h=>{
      const v = gross(pid,h);
      if(v==null) return "<td class='muted'>·</td>";
      const k = v < c.par[h] ? "u" : (v > c.par[h] ? "o" : "");
      const st = strokes(pid,h);
      return "<td class='"+k+(st>0?" dot":"")+(st>1?" d2":"")+"' style='position:relative'>"+v+"</td>";
    };
    let out=0,inn=0,anyO=false,anyI=false;
    for(let h=0;h<9;h++){ r+=cell(h); const v=gross(pid,h); if(v!=null){out+=v;anyO=true;} }
    r += "<td class='tot'>"+(anyO?out:"·")+"</td>";
    for(let h=9;h<18;h++){ r+=cell(h); const v=gross(pid,h); if(v!=null){inn+=v;anyI=true;} }
    r += "<td class='tot'>"+(anyI?inn:"·")+"</td><td class='tot'>"+((anyO||anyI)?out+inn:"·")+"</td></tr>";
    tb.insertAdjacentHTML("beforeend", r);
  });
  t.appendChild(tb); bd.appendChild(t); wrap.appendChild(bd); m.appendChild(wrap);
  m.appendChild(el("div","tiny muted",
    "<b>Hcp</b> is the men's stroke index for this course — hole 1 on that row is where the first stroke falls. "+
    "A red dot marks a hole where that player gets a stroke. Tees are shown next to each name and follow whatever "+
    "tee they're set to in Setup → Today's field. Tap “Hole” above to enter scores."));
}

/* Swipe a bet left to reject it (or restore a rejected one). Tapping still
   opens the editor — we only swallow the tap if the finger actually moved.
   Uses pointer events so it works with a mouse for testing too. */
const SWIPE_OPEN = 118, SWIPE_TRIGGER = 62;
function attachSwipe(row, act, bet){
  let x0=0, y0=0, dx=0, dragging=false, decided=false, moved=false;

  const setX = v => { row.style.transform = v ? "translateX("+v+"px)" : ""; };
  const snapBack = ()=>{ row.classList.add("snap"); setX(0); setTimeout(()=>row.classList.remove("snap"), 200); };

  row.addEventListener("pointerdown", e=>{
    if(e.pointerType==="mouse" && e.button!==0) return;
    x0=e.clientX; y0=e.clientY; dx=0; dragging=true; decided=false; moved=false;
    row.classList.add("sliding");
  });

  row.addEventListener("pointermove", e=>{
    if(!dragging) return;
    const mx = e.clientX-x0, my = e.clientY-y0;
    if(!decided){
      if(Math.abs(mx)<6 && Math.abs(my)<6) return;
      decided = true;
      // vertical intent wins — let the list scroll instead of hijacking it
      if(Math.abs(my) > Math.abs(mx)){ dragging=false; row.classList.remove("sliding"); return; }
      row.setPointerCapture(e.pointerId);
    }
    moved = true;
    dx = clamp(mx, -SWIPE_OPEN, 0);
    setX(dx);
  });

  const finish = ()=>{
    if(!dragging) return;
    dragging=false;
    row.classList.remove("sliding");
    if(dx <= -SWIPE_TRIGGER){
      setX(-SWIPE_OPEN);
      setTimeout(()=>{
        bet.rejected = !bet.rejected;
        Store.save(); render();
      }, 120);
    } else snapBack();
  };
  row.addEventListener("pointerup", finish);
  row.addEventListener("pointercancel", ()=>{ if(dragging){ dragging=false; row.classList.remove("sliding"); snapBack(); } });

  row.addEventListener("click", e=>{
    if(moved){ e.preventDefault(); e.stopPropagation(); moved=false; return; }
    betSheet(bet);
  });
}

function betSheet(bet){
  const isNew = !bet;
  const draft = bet ? JSON.parse(JSON.stringify(bet))
                    : { id:uid("b"), a:[], b:[], stake:G().betsCfg.stake, cap:G().betsCfg.cap, rejected:false };

  sheet(isNew?"Book a bet":"Edit bet", inner=>{
    const rebuild = ()=>{
      inner.innerHTML = "";

      /* One card per side. Chosen players show as removable chips; everyone
         else stays behind a native dropdown, which on a phone opens the OS
         scroll picker instead of papering the screen with 24 buttons. */
      [["a","Side 1"],["b","Side 2"]].forEach(([key,label])=>{
        const card = el("div","sidecard");
        const hd = el("div","row");
        hd.appendChild(el("div","sidettl", label));
        const n = draft[key].length;
        hd.appendChild(el("span","tiny muted right", n? (n===2?"better ball":"single") : "nobody yet"));
        card.appendChild(hd);

        const chips = el("div","chips");
        draft[key].forEach(pid=>{
          const chip = el("span","chip", esc(pname(pid))+"<b>×</b>");
          chip.onclick = ()=>{
            draft[key] = draft[key].filter(x=>x!==pid);
            rebuild();
          };
          chips.appendChild(chip);
        });
        card.appendChild(chips);

        if(draft[key].length < 2){
          const taken = new Set([...draft.a, ...draft.b]);
          const sel = el("select","addsel");
          sel.appendChild(el("option","","+ Add player"));
          sel.firstChild.value = "";
          inGame()
            .filter(pid=>!taken.has(pid))
            .sort((x,y)=> pname(x).localeCompare(pname(y)))
            .forEach(pid=>{
              const o = el("option","", esc(pname(pid)) + (teeOf(pid)? " — "+esc(teeOf(pid).name) : ""));
              o.value = pid;
              sel.appendChild(o);
            });
          sel.onchange = ()=>{
            if(!sel.value) return;
            draft[key].push(sel.value);
            rebuild();
          };
          card.appendChild(sel);
        }
        inner.appendChild(card);
      });

      const g2 = el("div","grid2");
      g2.innerHTML =
        '<label class="f"><span>$ per stroke</span><input type="number" id="bs" value="'+draft.stake+'" min="0" step="1"></label>'+
        '<label class="f"><span>Cap ($)</span><input type="number" id="bc" value="'+draft.cap+'" min="0" step="1"></label>';
      inner.appendChild(g2);
      $("#bs",inner).oninput = e=> draft.stake = Math.max(0, parseInt(e.target.value,10)||0);
      $("#bc",inner).oninput = e=> draft.cap   = Math.max(0, parseInt(e.target.value,10)||0);

      const rej = el("label","f row");
      rej.style.gap="8px";
      const cbx = el("input"); cbx.type="checkbox"; cbx.checked = draft.rejected; cbx.style.width="18px";
      cbx.onchange = ()=> draft.rejected = cbx.checked;
      rej.append(cbx, el("span","","Rejected / voided — keep it on the sheet but pay nothing"));
      rej.querySelector("span").style.cssText = "display:inline;font-size:13px;text-transform:none;letter-spacing:0;color:var(--ink);font-weight:400;margin:0";
      inner.appendChild(rej);

      const row = el("div","row"); row.style.marginTop="6px";
      const save = el("button","btn grow", isNew?"Book it":"Save");
      save.disabled = !draft.a.length || !draft.b.length;
      if(save.disabled) inner.appendChild(el("div","tiny muted","Add at least one player to each side."));
      save.onclick = ()=>{
        if(isNew) Store.s.bets.push(draft);
        else Object.assign(bet, draft);
        Store.save(); closeSheet(); render();
      };
      row.appendChild(save);
      if(!isNew){
        const del = el("button","btn ghost","Delete");
        del.style.color="var(--red)";
        del.onclick = ()=>{
          if(!confirm("Delete this bet?")) return;
          Store.s.bets = Store.s.bets.filter(x=>x.id!==bet.id);
          Store.save(); closeSheet(); render();
        };
        row.appendChild(del);
      }
      inner.appendChild(row);
    };
    rebuild();
  });
}

/* ---------------- CSV IMPORT ---------------- */
function normName(s){
  return String(s||"").toLowerCase().replace(/['’.]/g,"").replace(/[^a-z\s]/g," ").replace(/\s+/g," ").trim();
}
function splitCSVLine(line){
  const out=[]; let cur="", inQ=false;
  for(let i=0;i<line.length;i++){
    const c=line[i];
    if(inQ){
      if(c==='"'){ if(line[i+1]==='"'){cur+='"'; i++;} else inQ=false; }
      else cur+=c;
    } else if(c==='"') inQ=true;
    else if(c===','){ out.push(cur); cur=""; }
    else cur+=c;
  }
  out.push(cur);
  return out.map(s=>s.trim());
}
/** Parses a roster CSV, matching rows to existing players where it can.
    Header row is optional and matched loosely; falls back to
    Name, Index[, Email[, Tee]] column order if no header is found. */
function parseRosterCSV(text){
  const lines = String(text||"").split(/\r?\n/).map(l=>l.trim()).filter(Boolean);
  if(!lines.length) return [];
  const head = splitCSVLine(lines[0]).map(h=>h.toLowerCase());
  const findCol = (...keys)=> head.findIndex(h=> keys.some(k=>h.includes(k)));
  let ci = { name: findCol("name","player"), idx: findCol("index","hcp","handicap"), email: findCol("email"), tee: findCol("tee") };
  const hasHeader = ci.name>=0 || ci.idx>=0;
  let start = 0;
  if(hasHeader) start = 1;
  else ci = { name:0, idx:1, email:2, tee:3 };

  const existingByNorm = {}, byLast = {};
  Store.s.players.forEach(p=>{
    existingByNorm[normName(p.name)] = p.id;
    const parts = normName(p.name).split(" "), last = parts[parts.length-1];
    (byLast[last] = byLast[last]||[]).push(p.id);
  });

  const rows = [];
  for(let i=start;i<lines.length;i++){
    const cells = splitCSVLine(lines[i]);
    const name = (ci.name>=0 ? cells[ci.name] : "") || "";
    if(!name) continue;
    const idxRaw = ci.idx>=0 ? cells[ci.idx] : "";
    const idxNum = idxRaw==="" ? null : parseFloat(String(idxRaw).replace(/[^0-9.\-]/g,""));
    const email = ci.email>=0 ? (cells[ci.email]||"") : "";
    const teeName = ci.tee>=0 ? (cells[ci.tee]||"") : "";
    let teeId = null;
    if(teeName){
      const t = course().tees.find(t=> t.name.toLowerCase()===teeName.trim().toLowerCase());
      if(t) teeId = t.id;
    }
    const n = normName(name);
    let matchId = existingByNorm[n] || null;
    if(!matchId){
      const parts = n.split(" "), last = parts[parts.length-1];
      if(byLast[last] && byLast[last].length===1) matchId = byLast[last][0];
    }
    if(!matchId){
      const reversed = n.split(" ").reverse().join(" ");
      matchId = existingByNorm[reversed] || null;
    }
    rows.push({ name, index: (idxNum==null||isNaN(idxNum))?null:idxNum, email, tee:teeName, teeId, matchId: matchId || "__new__" });
  }
  return rows;
}

      pc.appendChild(pbd); m.appendChild(pc);

      const doImport = el("button","btn block","Import");
      doImport.onclick = ()=>{
        let updated=0, created=0;
        importState.rows.forEach(row=>{
          if(!row.matchId || row.matchId==="__skip__") return;
          if(row.matchId==="__new__"){
            const np = { id:uid("p"), name:row.name, index:row.index, sex:"M", email:row.email||"", homeTee: row.teeId || course().tees[0].id, notes:"" };
            Store.s.players.push(np);
            Store.s.scores[np.id] = new Array(H).fill(null);
            created++;
          } else {
            const p = player(row.matchId);
            if(p){
              if(row.index!=null) p.index = row.index;
              if(row.email) p.email = row.email;
              if(row.teeId) p.homeTee = row.teeId;
              updated++;
            }
          }
        });
        Store.save();
        alert("Imported: "+updated+" updated, "+created+" created.");
        importState = { raw:"", rows:null };
        sub = { type:"players" }; render();
      };
      m.appendChild(doImport);
    }
  }
}

let draftState = { method:null, teamSize:null, preview:null };

function setupDraw(m){
  backBtn(m);
  const g = G();
  if(!draftState.method) draftState.method = (g.draw && g.draw.method!=="committee" && g.draw.method) || "abcd";
  if(!draftState.teamSize) draftState.teamSize = (g.draw && g.draw.teamSize) ||
    Math.max(2, Math.round(inGame().length / (g.groups.length||6)));

  const head = el("div","card");
  head.appendChild(el("div","hd","<h3>Build teams</h3>"));
  const hb = el("div","bd");
  hb.appendChild(el("div","tiny muted","Choose how today's teams get formed. Tee times stay the same where possible — this only decides who's grouped with whom."));
  const grid = el("div","pickgrid"); grid.style.marginTop="9px";
  DRAW_METHODS.forEach(([k,label,desc])=>{
    const b = el("button","pick"+(draftState.method===k?" on":""), esc(label)+'<span class="s">'+esc(desc)+'</span>');
    b.onclick = ()=>{ draftState.method=k; draftState.preview=null; render(); };
    grid.appendChild(b);
  });
  hb.appendChild(grid);

  if(draftState.method==="committee"){
    hb.appendChild(el("div","banner","<b>Committee mode</b> — no draw runs. Use “Groups &amp; tee times” below to hand-assign players."));
    const gob = el("button","btn ghost block","Go to Groups & tee times");
    gob.style.marginTop="9px";
    gob.onclick = ()=>{
      g.draw = { method:"committee", teamSize:draftState.teamSize, seed:null, appliedAt:new Date().toISOString(), manuallyAdjusted:false };
      Store.save(); sub={type:"groups"}; render();
    };
    hb.appendChild(gob);
  } else {
    const ts = el("label","f"); ts.style.marginTop="11px";
    ts.innerHTML = "<span>Players per team</span>";
    const inp = el("input"); inp.type="number"; inp.min="2"; inp.max="8"; inp.value=draftState.teamSize;
    inp.oninput = ()=>{ draftState.teamSize = clamp(parseInt(inp.value,10)||4,2,8); draftState.preview=null; };
    ts.appendChild(inp); hb.appendChild(ts);

    const row = el("div","row"); row.style.marginTop="9px";
    const gen = el("button","btn grow", draftState.preview? "Reroll":"Generate");
    gen.onclick = ()=>{
      const seed = newSeed();
      const teams = genTeams(draftState.method, draftState.teamSize, seed);
      draftState.preview = { method:draftState.method, teamSize:draftState.teamSize, seed, teams,
        rerolls: draftState.preview ? draftState.preview.rerolls+1 : 0 };
      render();
    };
    row.appendChild(gen);
    hb.appendChild(row);
  }
  head.appendChild(hb); m.appendChild(head);

  if(draftState.preview && draftState.method!=="committee"){
    const teams = draftState.preview.teams;
    const { totals, avgs, spread } = draftStats(teams);
    const anyEstimated = teams.some(t=> t.some(pid=> balanceInfo(pid).estimated));

    const pc = el("div","card");
    pc.appendChild(el("div","hd","<h3>Preview</h3><span class='right pill'>spread "+spread.toFixed(1)+"</span>"));
    const pb = el("div","bd flush");
    teams.forEach((t,i)=>{
      const row = el("div","prow");
      row.innerHTML = "<div class='grow'><div class='nm'>Team "+(i+1)+"</div>"+
        "<div class='hc'>"+t.map(pid=>pname(pid).replace(/^(\w)\.\s*/,"")).join(", ")+"</div></div>"+
        "<div class='tiny muted' style='text-align:right;flex:none'>total "+totals[i].toFixed(1)+"<br>avg "+avgs[i].toFixed(1)+"</div>";
      pb.appendChild(row);
    });
    pc.appendChild(pb);
    if(anyEstimated) pc.appendChild(el("div","bd","<div class='tiny muted'>~ players without an index on file were treated as the field average, just for balancing — enter their real index when you have it.</div>"));
    m.appendChild(pc);

    const apply = el("button","btn block","Apply this draw");
    apply.onclick = ()=>{
      if(!confirm("Replace the current groups with this draw?")) return;
      applyDraw(teams, {
        method: draftState.preview.method, teamSize: draftState.preview.teamSize,
        seed: draftState.preview.seed, rerolls: draftState.preview.rerolls,
        appliedAt: new Date().toISOString()
      });
      draftState.preview=null; sub=null; render();
    };
    m.appendChild(apply);
  }

  if(g.draw){
    const meth = DRAW_METHODS.find(x=>x[0]===g.draw.method);
    const info = el("div","tiny muted"); info.style.margin="4px 2px 0";
    info.textContent = "Current groups: "+(meth?meth[1]:g.draw.method)+" · applied "+new Date(g.draw.appliedAt).toLocaleString()+
      (g.draw.seed!=null? " · seed "+g.draw.seed : "")+
      (g.draw.rerolls? " · rerolled "+g.draw.rerolls+"×before applying":"")+
      (g.draw.manuallyAdjusted? " · manually adjusted since":"");
    m.appendChild(info);
  }
}

  $("#p1",g4).onchange = e=>{ g.money.payouts[0]=Math.max(0,parseInt(e.target.value,10)||0); Store.save(); render(); };
  $("#p2",g4).onchange = e=>{ g.money.payouts[1]=Math.max(0,parseInt(e.target.value,10)||0); Store.save(); render(); };
  b4.appendChild(el("div","tiny muted","Ties share a place — two groups tied for 2nd both get the 2nd-place rate, exactly like the spreadsheet."));
  c4.appendChild(b4); m.appendChild(c4);
}

/* ---------------- sheets / identity ---------------- */
let sheetEl = null;
/* The title bar and its X live outside the body element, so a caller that
   redraws its own contents can't accidentally wipe the only way out. */
function sheet(title, build){
  closeSheet();
  const s = el("div","sheet");
  const inner = el("div","inner");
  const hd = el("div","sheethd");
  hd.appendChild(el("h2","", esc(title)));
  const x = el("button","sheetx","×");
  x.setAttribute("aria-label","Close");
  x.onclick = closeSheet;
  hd.appendChild(x);
  const body = el("div","sheetbody");
  inner.append(hd, body);
  s.appendChild(inner);
  s.onclick = e=>{ if(e.target===s) closeSheet(); };
  document.body.appendChild(s);
  sheetEl = s;
  build(body);
}
function closeSheet(){ if(sheetEl){ sheetEl.remove(); sheetEl=null; } }

function exportJSON(){
  const blob = new Blob([JSON.stringify(Store.s,null,2)],{type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = (G().name||"club-game").replace(/\W+/g,"-").toLowerCase()+"-"+G().date+".json";
  a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
}

/* ------------------------------------------------------------
   FIREBASE SYNC
   Live sync over Realtime Database. Every record (a score cell,
   a player, a group, a bet) carries its own timestamp so merges
   are newest-wins — the same pattern proven on the Michigan app.
   This lets several scorers write at once without clobbering
   each other: writes are scoped to the smallest reasonable node
   (scores/$pid/$hole, players/$pid, groups/$gid, bets/$bid —
   never a whole collection), matching database.rules.json.
   Set FIREBASE_CONFIG to null to run purely local, no code changes.
   ------------------------------------------------------------ */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyDnOofu0ZzRoCpjl27ZjF9QLmrXr1BDA20",
  authDomain: "club-game-with-sidebets.firebaseapp.com",
  databaseURL: "https://club-game-with-sidebets-default-rtdb.firebaseio.com",
  projectId: "club-game-with-sidebets",
  storageBucket: "club-game-with-sidebets.firebasestorage.app",
  messagingSenderId: "99531798281",
  appId: "1:99531798281:web:db211c0f9472a0c9d385d8"
};

function mergeRemoteRecord(coll, id, clean){
  if(coll==="players"){
    let p = Store.s.players.find(x=>x.id===id);
    if(!p){ p = {id}; Store.s.players.push(p); if(!Store.s.scores[id]) Store.s.scores[id] = new Array(H).fill(null); }
    Object.assign(p, clean, {id});
    return true;
  }
  if(coll==="groups"){
    let g = G().groups.find(x=>x.id===id);
    if(!g){ g = {id}; G().groups.push(g); }
    Object.assign(g, clean, {id});
    return true;
  }
  if(coll==="bets"){
    let b = Store.s.bets.find(x=>x.id===id);
    if(!b){ b = {id}; Store.s.bets.push(b); }
    Object.assign(b, clean, {id});
    return true;
  }
  return false;
}
function removeRemoteRecord(coll, id){
  if(coll==="players"){ Store.s.players = Store.s.players.filter(x=>x.id!==id); delete Store.s.scores[id]; return true; }
  if(coll==="groups"){ G().groups = G().groups.filter(x=>x.id!==id); return true; }
  if(coll==="bets"){ Store.s.bets = Store.s.bets.filter(x=>x.id!==id); return true; }
  return false;
}

const Sync = {
  ready:false, online:false, writeErr:null, db:null, _fns:null, _offset:0, _prev:null,

  now(){ return Date.now() + this._offset; },

  /* ----------------------------------------------------------------
     Keeping the diff baseline honest.
     _prev is "what we believe the server already has". When a change
     arrives FROM the server we must update _prev too — otherwise a
     later local edit back to _prev's stale value looks like "no
     change" and never gets pushed. That silently broke clearing a
     score another device had entered.
     ---------------------------------------------------------------- */
  notePrevScore(pid, h){
    if(!this._prev) return;
    (this._prev.scores[pid] = this._prev.scores[pid] || [])[h] = Store.s.scores[pid][h];
  },
  notePrevRecord(coll, id, item){
    if(!this._prev) return;
    const map = this._prev[coll] || (this._prev[coll] = {});
    if(item === null) delete map[id];
    else map[id] = JSON.stringify(item);
  },
  notePrevSingleton(key, value){
    if(!this._prev) return;
    this._prev[key] = JSON.stringify(value);
  },

  write(path, val){
    if(!this.ready) return;
    const p = this._fns.set(this._fns.ref(this.db, path), val);
    p.then(()=>{ if(this.writeErr){ this.writeErr=null; render(); } })
     .catch(err=>{ this.writeErr = (err && (err.code||err.message)) || "write failed"; console.warn("write rejected:", path, this.writeErr); render(); });
  },

  /** Called from Store.save() every time. Diffs the current state against
      the last snapshot we pushed and writes only what actually changed,
      each leaf getting a fresh timestamp. Cheap even at 24 players x 18
      holes — this is a few hundred string compares, not a bottleneck. */
  diffAndPush(s){
    if(!this.ready) return;
    const prev = this._prev || (this._prev = { scores:{}, players:{}, groups:{}, bets:{}, entrants:{}, draw:null, settings:null });

    Object.keys(s.scores).forEach(pid=>{
      const arr = s.scores[pid], prevArr = prev.scores[pid] || [];
      arr.forEach((v,h)=>{
        if(v !== prevArr[h]){
          const t = this.now();
          (s.meta.scores[pid] = s.meta.scores[pid]||{})[h] = t;
          this.write(`scores/${pid}/${h}`, { v, t });
        }
      });
      prev.scores[pid] = arr.slice();
    });

    const syncColl = (coll, list)=>{
      const prevMap = prev[coll] || (prev[coll] = {});
      const seen = new Set();
      list.forEach(item=>{
        seen.add(item.id);
        const snap = JSON.stringify(item);
        if(prevMap[item.id] !== snap){
          const t = this.now();
          s.meta[coll][item.id] = t;
          this.write(`${coll}/${item.id}`, Object.assign({}, item, { t }));
          prevMap[item.id] = snap;
        }
      });
      Object.keys(prevMap).forEach(id=>{
        if(!seen.has(id)){ this.write(`${coll}/${id}`, null); delete prevMap[id]; delete s.meta[coll][id]; }
      });
    };
    syncColl("players", s.players);
    syncColl("groups", s.game.groups);
    syncColl("bets", s.bets);

    {
      const prevMap = prev.entrants || (prev.entrants = {});
      const seen = new Set();
      Object.keys(s.game.entrants).forEach(pid=>{
        seen.add(pid);
        const snap = JSON.stringify(s.game.entrants[pid]);
        if(prevMap[pid] !== snap){
          const t = this.now();
          s.meta.entrants[pid] = t;
          this.write(`entrants/${pid}`, Object.assign({}, s.game.entrants[pid], { t }));
          prevMap[pid] = snap;
        }
      });
      Object.keys(prevMap).forEach(pid=>{
        if(!seen.has(pid)){ this.write(`entrants/${pid}`, null); delete prevMap[pid]; delete s.meta.entrants[pid]; }
      });
    }
    {
      const snap = JSON.stringify(s.game.draw);
      if(prev.draw !== snap){
        const t = this.now();
        s.meta.draw = t;
        this.write("draw", s.game.draw ? Object.assign({}, s.game.draw, { t }) : null);
        prev.draw = snap;
      }
    }
    {
      const snap = JSON.stringify(s.admin);
      if(prev.admin !== snap){
        const t = this.now();
        s.meta.admin = t;
        this.write("admin", Object.assign({}, s.admin, { t }));
        prev.admin = snap;
      }
    }
    {
      const { entrants, groups, draw, ...rest } = s.game;
      const snap = JSON.stringify(rest);
      if(prev.settings !== snap){
        const t = this.now();
        s.meta.settings = t;
        this.write("settings", Object.assign({}, rest, { t }));
        prev.settings = snap;
      }
    }
  },

  async init(){
    if(!FIREBASE_CONFIG) return;
    try{
      const [{ initializeApp }, { getAuth, signInAnonymously }, { getDatabase, ref, onValue, set, get }] = await Promise.all([
        import("https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js"),
        import("https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js"),
        import("https://www.gstatic.com/firebasejs/10.12.5/firebase-database.js")
      ]);
      const app = initializeApp(FIREBASE_CONFIG);
      this.db = getDatabase(app);
      this._fns = { ref, set };
      try{ await signInAnonymously(getAuth(app)); }
      catch(e){ console.warn("anonymous auth unavailable", e && e.code); }

      // Has ANYONE ever connected this database before? If so, this device's
      // local seed is just whatever it happened to generate on first load —
      // not the truth — and must never be force-pushed over real shared data.
      // Only a genuinely first-ever connection gets to seed the database.
      let remoteAlreadyExists = false;
      try{ remoteAlreadyExists = (await get(ref(this.db, "settings"))).exists(); }
      catch(e){ console.warn("initial existence check failed", e); }
      if(Store.freshlySeeded) Store.isFirstEverDevice = !remoteAlreadyExists;

      // This device seeded itself locally (empty localStorage) but real
      // shared data already exists elsewhere — discard the local guess so
      // it doesn't sit alongside the real roster as duplicate ghost records.
      if(remoteAlreadyExists && Store.freshlySeeded){
        Store.s.players = []; Store.s.scores = {}; Store.s.bets = [];
        Store.s.game.groups = []; Store.s.game.entrants = {};
        Store.s.meta = { scores:{}, players:{}, groups:{}, bets:{}, entrants:{}, draw:0, settings:0, admin:Store.s.meta.admin||0 };
      }

      onValue(ref(this.db, ".info/connected"), snap=>{ this.online = !!snap.val(); render(); });
      onValue(ref(this.db, ".info/serverTimeOffset"), snap=>{ const v=snap.val(); if(typeof v==="number") this._offset=v; });

      onValue(ref(this.db, "scores"), snap=>{
        const all = snap.val()||{}; let changed=false;
        Object.keys(all).forEach(pid=>{
          if(!Store.s.scores[pid]) return;
          const cell = all[pid]||{};
          Object.keys(cell).forEach(h=>{
            const rec = cell[h]; if(!rec) return;
            const localT = (Store.s.meta.scores[pid]||{})[h] || 0;
            if(rec.t > localT){
              Store.s.scores[pid][h] = rec.v==null ? null : rec.v;
              (Store.s.meta.scores[pid] = Store.s.meta.scores[pid]||{})[h] = rec.t;
              this.notePrevScore(pid, h);
              changed = true;
            }
          });
        });
        if(changed){ localStorage.setItem(KEY, JSON.stringify(Store.s)); render(); }
      });

      ["players","groups","bets"].forEach(coll=>{
        onValue(ref(this.db, coll), snap=>{
          const all = snap.val()||{}; let changed=false;
          Object.keys(all).forEach(id=>{
            const rec = all[id]; if(!rec) return;
            const localT = Store.s.meta[coll][id] || 0;
            if(rec.t > localT){
              const clean = Object.assign({}, rec); delete clean.t;
              if(mergeRemoteRecord(coll, id, clean)) changed = true;
              Store.s.meta[coll][id] = rec.t;
              const listNow = coll==="players" ? Store.s.players : coll==="groups" ? G().groups : Store.s.bets;
              this.notePrevRecord(coll, id, listNow.find(x=>x.id===id) || null);
            }
          });
          const list = coll==="players" ? Store.s.players : coll==="groups" ? G().groups : Store.s.bets;
          list.slice().forEach(item=>{
            if(!(item.id in all) && Store.s.meta[coll][item.id]){
              removeRemoteRecord(coll, item.id);
              delete Store.s.meta[coll][item.id];
              this.notePrevRecord(coll, item.id, null);
              changed = true;
            }
          });
          if(changed){ localStorage.setItem(KEY, JSON.stringify(Store.s)); render(); }
        });
      });

      onValue(ref(this.db, "entrants"), snap=>{
        const all = snap.val()||{}; let changed=false;
        Object.keys(all).forEach(pid=>{
          const rec = all[pid]; if(!rec) return;
          const localT = Store.s.meta.entrants[pid] || 0;
          if(rec.t > localT){
            const clean = Object.assign({}, rec); delete clean.t;
            G().entrants[pid] = clean;
            Store.s.meta.entrants[pid] = rec.t;
            this.notePrevRecord("entrants", pid, clean);
            changed = true;
          }
        });
        Object.keys(G().entrants).forEach(pid=>{
          if(!(pid in all) && Store.s.meta.entrants[pid]){
            delete G().entrants[pid]; delete Store.s.meta.entrants[pid];
            this.notePrevRecord("entrants", pid, null);
            changed = true;
          }
        });
        if(changed){ localStorage.setItem(KEY, JSON.stringify(Store.s)); render(); }
      });

      onValue(ref(this.db, "draw"), snap=>{
        const rec = snap.val(); if(!rec) return;
        if(rec.t > (Store.s.meta.draw||0)){
          const clean = Object.assign({}, rec); delete clean.t;
          G().draw = clean; Store.s.meta.draw = rec.t;
          this.notePrevSingleton("draw", G().draw);
          localStorage.setItem(KEY, JSON.stringify(Store.s)); render();
        }
      });

      onValue(ref(this.db, "admin"), snap=>{
        const rec = snap.val(); if(!rec) return;
        if(rec.t > (Store.s.meta.admin||0)){
          const clean = Object.assign({}, rec); delete clean.t;
          Store.s.admin = clean; Store.s.meta.admin = rec.t;
          this.notePrevSingleton("admin", Store.s.admin);
          localStorage.setItem(KEY, JSON.stringify(Store.s)); render();
        }
      });

      onValue(ref(this.db, "settings"), snap=>{
        const rec = snap.val(); if(!rec) return;
        if(rec.t > (Store.s.meta.settings||0)){
          const clean = Object.assign({}, rec); delete clean.t;
          Object.assign(G(), clean); Store.s.meta.settings = rec.t;
          const { entrants, groups, draw, ...rest } = G();
          this.notePrevSingleton("settings", rest);
          localStorage.setItem(KEY, JSON.stringify(Store.s)); render();
        }
      });

      this.ready = true;
      if(!remoteAlreadyExists) Store.save();   // first device ever to connect seeds the database
    }catch(e){ console.warn("firebase init failed", e); }
  }
};

/* ---------------- boot ---------------- */
Store.load();
Sync.init();
render();
